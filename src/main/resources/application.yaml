server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: connect-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/tatame}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    properties:
      hibernate:
        default_schema: tatame
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:root}
    password: ${RABBITMQ_PASS:root}

jwt:
  secret: ${JWT_SECRET:}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}

aws:
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:auto}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    bucket: ${S3_BUCKET:tatame-photos}
    public-base-url: ${S3_PUBLIC_BASE_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.tatame: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
